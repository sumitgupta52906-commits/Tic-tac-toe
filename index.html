<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 1.8rem;
      color: #38bdf8;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 320px;
      margin: 0 auto 20px auto;
    }
    .cell {
      width: 100%;
      height: 0;
      padding-bottom: 100%; /* Yeh ensure karega ki shuruwat se hi box perfect square ho */
      background: #131b2e;
      border: 1px solid #1f2937;
      border-radius: 8px;
      position: relative;
      cursor: pointer;
      outline: none;
      transition: background 0.2s;
    }
    .cell:hover {
      background: #1e293b;
    }
    .cell::after {
      content: attr(data-content);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 900;
      color: #38bdf8;
    }
    .cell.x::after {
      color: #f43f5e;
    }
    .status {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #94a3b8;
    }
    button#reset {
      background: #38bdf8;
      color: #0b0f19;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button#reset:hover {
      background: #0ea5e9;
    }
  </style>
</head>
<body>

  <h1>Tic Tac Toe</h1>
  <div class="status" id="statusText">Aapki baari hai!</div>
  
  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <button id="reset">Restart Game</button>

  <script>
    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('statusText');
    const resetButton = document.getElementById('reset');
    
    let board = ['', '', '', '', '', '', '', '', ''];
    let isGameActive = true;
    let currentPlayer = 'X';

    function renderBoard() {
      cells.forEach((c, i) => {
        const val = board[i] || '';
        c.setAttribute('data-content', val);
        c.classList.toggle('x', val === 'X');
      });
    }

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        const index = cell.getAttribute('data-index');
        if (board[index] !== '' || !isGameActive) return;

        board[index] = currentPlayer;
        renderBoard();

        // Simple check or turn swap logic can go here
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        statusText.textContent = `Player ${currentPlayer} ki baari hai`;
      });
    });

    resetButton.addEventListener('click', () => {
      board = ['', '', '', '', '', '', '', '', ''];
      isGameActive = true;
      currentPlayer = 'X';
      statusText.textContent = 'Aapki baari hai!';
      renderBoard();
    });

    // Initial render call
    renderBoard();
  </script>
</body>
    </html>
